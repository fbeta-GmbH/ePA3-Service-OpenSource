    "jwcrypto==1.5.6",
    "oqs==0.10.2",
    "python-dotenv==1.1.0",
    "Requests==2.32.3",
    "python-multipart",
    "zeep==4.3.1",
    "lxml==5.3.2",
    "jsonschema==4.23.0",
    "pymtom-xop==0.0.2",
    "pyjson5==1.6.8",
    "fastapi==0.115.6",
