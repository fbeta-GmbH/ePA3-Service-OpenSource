[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epa-core"
version = "2.0.0.dev1"
description = "Python library for interacting with the German electronic patient record (ePA) 3.x"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
authors = [{ name = "fbeta GmbH" }]
keywords = ["ePA", "gematik", "VAU", "Konnektor", "IDP", "SOAP"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "asn1crypto==1.5.1",
    "cbor2==6.1.5",
    "coloredlogs==15.0.1",
    "cryptography==50.0.2",
    "ecdsa==0.19.2",
    "jsonschema==4.26.0",
    "jwcrypto==1.6.1",
    "lxml==6.1.3",
    "pydantic==2.14.1",
    "pyhanko-certvalidator==0.33.0",
    "pyjson5==2.0.1",
    "pymtom_xop==0.0.2",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "requests_pkcs12==1.27",
    "zeep==4.3.3",
    "liboqs-python @ git+https://github.com/open-quantum-safe/liboqs-python.git@9ab93b648e0253087f3c627af3674c058ede391b"
]

[project.urls]
Homepage = "https://fbeta.de/ti-support/"
Repository = "https://github.com/fbeta-GmbH/ePA3-Service-OpenSource"
Issues = "https://github.com/fbeta-GmbH/ePA3-Service-OpenSource/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epa_core = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
